# Bring a crashed cluster back without a human.
#
# Debian ships Restart=no, so a postgres killed by the OOM killer or dying on an assertion stays
# down until somebody notices. That is the most likely real failure on a single machine, and it
# is also the one a failover system would be a very large hammer for: restarting in five seconds
# beats promoting a standby, and leaves no diverged node to rebuild afterwards.
#
# on-failure, not always: a cluster stopped deliberately with pg_ctlcluster exits cleanly and
# must stay stopped, or maintenance becomes impossible.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5s
