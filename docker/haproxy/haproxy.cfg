# Two front doors onto the same cluster.
#
#   :5000  the node that accepts writes
#   :5001  the node that serves replica reads
#
# Neither is a hostname. Both are decided by asking each node pg_is_in_recovery(), because after
# a promotion the names are wrong and nothing renames them.
#
# The nodes are clusters on the host, reached through the docker bridge - so all three servers
# share an address and differ only by port.

global
    log stdout format raw local0 info
    # external-check runs a process per health check, so HAProxy requires both of these stated
    # explicitly. It is the price of asking a question the built-in checks cannot ask.
    external-check
    insecure-fork-wanted

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    # Generous, because these carry database sessions rather than HTTP requests: a connection
    # pool holds a connection open and idle between statements, and closing it underneath the
    # pool produces errors that look like database faults.
    timeout client 12h
    timeout server 12h
    default-server inter 3s fall 2 rise 2

# ---------------------------------------------------------------------------------------------
# :5000 - writes. Exactly one node passes this check at a time.
# ---------------------------------------------------------------------------------------------
listen postgres_primary
    bind *:5000
    option external-check
    external-check command /usr/local/bin/check-role.sh
    # on-marked-down shutdown-sessions is the line that makes the health check mean anything.
    #
    # Without it HAProxy stops sending NEW connections to a failed node and leaves established
    # ones alone - and HikariCP holds connections open for minutes. The pool would go on writing
    # to a node the checks had already condemned, which during a failover means writing to a
    # server that is no longer the primary. Killing the sessions forces the pool to reconnect and
    # be routed again.
    default-server on-marked-down shutdown-sessions
    server eventticket host.docker.internal:5433 check
    server standby1    host.docker.internal:5434 check
    server standby2    host.docker.internal:5435 check

# ---------------------------------------------------------------------------------------------
# :5001 - replica reads.
# ---------------------------------------------------------------------------------------------
listen postgres_replica
    bind *:5001
    option external-check
    external-check command /usr/local/bin/check-role.sh
    default-server on-marked-down shutdown-sessions

    # One reader, deliberately. standby2 is left out so it stays a clean failover and
    # pg_basebackup target: unloaded, and not holding vacuum back on the primary. It is also what
    # makes the application's LSN comparison meaningful - with two readers the application cannot
    # tell which one HAProxy gave it, and would have to take the minimum replayed position across
    # both.
    server standby1 host.docker.internal:5434 check

    # There is deliberately no `backup` entry pointing at the primary.
    #
    # It was written that way first and it contradicts itself: this proxy's check passes only for
    # a node in recovery, so the primary can never pass it, and a backup line here would be dead
    # configuration that looks like a safety net.
    #
    # The fallback belongs in the application, which needs it anyway - it already has to route to
    # the primary when the replica is merely *behind*, which no proxy can detect. So when this
    # pool is empty, 5001 refuses connections and the application does what it does for a stale
    # replica: uses the primary.
