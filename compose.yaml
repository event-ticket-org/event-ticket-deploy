# The whole product, as containers.
#
# Distinct from event-ticket-backend/compose.yaml, which starts the two things a developer
# needs behind a locally-run application and nothing else. This one starts the application
# too, and is therefore the first place the deployed shape of the system exists: one origin in
# front of both halves, an object store the browser and the backend reach by different
# addresses, and not a single credential with a default.
#
# Images by tag rather than by build context, so this file is the same whether the images came
# from ./build.sh on a laptop or from a registry. build.sh is where the assumption about where
# the source lives is kept, and it is one variable.

name: event-ticket

services:
  # Object storage for cover images (ADR-0006).
  #
  # SeaweedFS rather than MinIO: the MinIO community edition was archived in April 2026 and its
  # Docker Hub repository withdrawn, so `minio/minio` cannot be pulled at any tag - the pinned
  # release included. A deployment whose store cannot be recreated from its own compose file is
  # one disk cleanup away from losing every cover permanently.
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    # The identity file is written here rather than baked, because the credentials are this
    # deployment's and arrive in the environment. SeaweedFS refuses every request until an
    # identity exists, so a file that fails to appear yields a store that rejects the
    # application - never one that lets the world write to it. That is the right direction to
    # fail in, and it is why the store is configured this way rather than by a root password.
    #
    # `Read:${STORAGE_BUCKET}` on the anonymous identity is what serves a cover to a public
    # page. Read is not List in SeaweedFS, so unlike `mc anonymous set download` there is no
    # way for this to quietly grant ListBucket as well - which matters because the keys carry
    # organization and event ids, so a listable bucket publishes which organizations exist and
    # how many events each has, drafts included.
    #
    # `-volume.max` is a count and not a size, and the default of 8 is the reason this is
    # written down. A volume holds 30GB; eight of them were exhausted here by 1.4MB of covers,
    # because SeaweedFS spreads concurrent writes across new volumes rather than filling one.
    # Then the `pending/` expiry below needs a volume of its own - data with a TTL cannot share
    # with data without one - and there was no slot left for it.
    #
    # What that looked like was every cover upload answering 500 while every cover already
    # stored kept serving perfectly: reads fine, writes dead, and nothing in the S3 error
    # mentioning volumes. Raising the ceiling costs nothing, since volumes are created on
    # demand rather than reserved.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities":[
          {"name":"app",
           "credentials":[{"accessKey":"$$STORAGE_ACCESS_KEY","secretKey":"$$STORAGE_SECRET_KEY"}],
           "actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"anonymous","actions":["Read:$$STORAGE_BUCKET"]}
        ]}
        JSON
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json \
          -volume.max=32
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    ports:
      # Published, unlike the database, because this one genuinely faces the browser: a cover
      # is posted straight here from a form and fetched straight from here on a public page.
      - "${STORAGE_PORT}:9000"
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket and expires abandoned uploads, then exits. Public read is not its job -
  # the identity file above grants that, so there is no policy to set and nothing to get wrong.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.46
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    # `weed shell` speaks to the master rather than the S3 API, which is why this needs the
    # image and not an S3 client.
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "s3.bucket.create -name $$STORAGE_BUCKET" | weed shell -master=seaweedfs:9333
        echo "fs.configure -locationPrefix=/buckets/$$STORAGE_BUCKET/pending/ -ttl=1d -apply" \
          | weed shell -master=seaweedfs:9333

  # ── Elasticsearch ─────────────────────────────────────────────────────────────────────────
  #
  # The search index, and later an ELK stack, on one cluster.
  #
  # Elasticsearch has no schemas and no databases - there is nothing between a cluster and an
  # index - so two systems sharing one are separated by a naming convention and by roles, not
  # by anything structural. The application claims `eventticket-*`; an ELK stack will claim
  # `logs-*`, `metrics-*` and `traces-*`, and Kibana `.kibana*`.
  #
  # **Everything in here is derived.** Every document is rebuilt from Postgres by the nightly
  # job, so losing this volume costs a rebuild and never data - which is why it is a container
  # while the database is not. The volume exists to avoid re-indexing on every restart, not to
  # keep anything.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    environment:
      discovery.type: single-node
      # Authentication on, TLS off, and both halves are deliberate. This is reachable on this
      # network and on loopback only, so transport encryption between containers on one host
      # buys nothing; basic auth is what will keep a Kibana, a beat and the application in
      # separate roles once the cluster is shared.
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${SEARCH_PASSWORD}
      # Stated rather than inherited. Left alone the JVM sizes its heap from the host's total
      # RAM, which on this machine is 23 GiB and not remotely what this should take. Half the
      # container limit, which is the shape Elasticsearch asks for.
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      # One node, so a replica has nowhere to go. Without this the first ELK index sits yellow
      # forever waiting for a shard that cannot be allocated, and "yellow" stops meaning
      # anything is wrong.
      cluster.routing.allocation.disk.threshold_enabled: "true"
    mem_limit: 4g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      # Loopback only. Nothing outside this host needs it, and a Kibana later will run beside
      # it rather than across a network.
      - "127.0.0.1:${SEARCH_PORT}:9200"
    healthcheck:
      # Authenticated, because an unauthenticated probe answers 401 and would mark a healthy
      # cluster unhealthy forever. Yellow counts as healthy: one node cannot be green with any
      # replica configured, and waiting for green is waiting for something that will not happen.
      # The "credential" the scanner sees below is the name of an environment variable, and the
      # curl-auth-user rule cannot tell `-u user:$VAR` from `-u user:hunter2`. Allowed inline
      # rather than by fingerprint, because a fingerprint is pinned to a commit sha and stops
      # matching the moment the commit is amended or rebased.
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"] # gitleaks:allow
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  backend:
    image: ${BACKEND_IMAGE}
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    # The database is not a container, so there is nothing here to wait for. It is a cluster on
    # the host under systemd, started before Docker and outliving every `compose down`.
    #
    # host.docker.internal resolves to the docker0 address rather than this network's gateway,
    # which is what the cluster's listen_addresses names. Reaching it needs three things to
    # agree - listen_addresses, pg_hba, and the host firewall - and the firewall is the one that
    # fails silently, because ufw drops rather than refuses and the symptom is a connection
    # timeout that reads like the server being down. host/install-postgres.sh sets the first two
    # and prints the ufw rule for the third.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      # Every link this system emails is built from this - address verification, a ticket, a
      # refund notice - so it has to be where a person's browser reaches the application, not
      # where the container thinks it is.
      APP_BASE_URL: http://localhost:${APP_PORT}

      JWT_SECRET: ${JWT_SECRET}
      TICKET_CODE_KEY: ${TICKET_CODE_KEY}
      FAKE_PAYMENT_SECRET: ${FAKE_PAYMENT_SECRET}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS}

      # The three storage addresses, and the reason there are three. `seaweedfs` is a name only
      # this network resolves, so it is right for the SDK and wrong for anything a browser is
      # handed; the other two are the published port, and stay separate because a CDN could
      # serve a cover without being able to accept one.
      STORAGE_ENDPOINT: http://seaweedfs:9000
      STORAGE_UPLOAD_BASE_URL: http://localhost:${STORAGE_PORT}
      STORAGE_PUBLIC_BASE_URL: http://localhost:${STORAGE_PORT}/${STORAGE_BUCKET}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_REGION: ${STORAGE_REGION}

      # The search cluster. Absent means there is no cluster and the listing serves from
      # Postgres; present means the indexer runs and the credentials are required, so an
      # application started without them refuses to boot rather than discovering at the first
      # publish that it cannot index anything.
      APP_SEARCH_URI: http://elasticsearch:9200
      APP_SEARCH_USERNAME: elastic
      APP_SEARCH_PASSWORD: ${SEARCH_PASSWORD}

      # Absent means there is no Stripe provider at all, rather than one that fails on first
      # use. Empty is the correct value for a deployment without an account.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    # A limit, at last, and the reason it arrives with Elasticsearch: two unbounded JVMs on one
    # box is how you find out that both sized their heaps from the host's total RAM. This one
    # had been sizing from 23 GiB since the first deployment, which was harmless only for as
    # long as it was the only JVM here.
    mem_limit: 2g
    # Not published. The browser reaches the API through the frontend's proxy on one origin,
    # which is the arrangement the client assumes - it asks for /api/v1 relative to wherever
    # it was served and never learns a backend address.
    healthcheck:
      # The health endpoint rather than the port, because `depends_on: service_healthy` is
      # only worth anything if it waits for Flyway and the context, not for a socket. The path
      # carries the context path, which is where the contract's /api/v1 comes from.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: http://backend:8080
    ports:
      - "${APP_PORT}:80"
    healthcheck:
      # By address, not by name. `localhost` is ::1 in here, and a check aimed at an interface
      # the server is not listening on stays red for ever while the site works perfectly.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  seaweeddata:
  # Derived, and disposable. Every document is rebuilt from Postgres by the nightly job, so
  # losing this costs a rebuild and never data. It exists to avoid re-indexing on each restart.
  elasticsearch-data:
